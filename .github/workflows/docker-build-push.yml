name: Reusable Maven Docker Build and Push

on:
  workflow_call:
    inputs:
      services:
        description: "JSON list of services"
        required: true
        type: string

      dockerhub_username:
        description: "Docker Hub username"
        required: true
        type: string

    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Get source code from caller repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Install Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build the complete Maven monorepo ONCE
      - name: Maven Build
        run: mvn -B clean package

      # 4. Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and push every service
      - name: Build and Push Docker Images
        shell: bash
        run: |
          echo '${{ inputs.services }}' | jq -c '.[]' | while read service; do

            NAME=$(echo "$service" | jq -r '.name')
            CONTEXT=$(echo "$service" | jq -r '.context')

            IMAGE="${{ inputs.dockerhub_username }}/${NAME}"

            echo "========================================="
            echo "Building: $NAME"
            echo "Context:  $CONTEXT"
            echo "Image:    $IMAGE"
            echo "========================================="

            docker build \
              -t "$IMAGE:latest" \
              -t "$IMAGE:${{ github.sha }}" \
              "$CONTEXT"

            docker push "$IMAGE:latest"
            docker push "$IMAGE:${{ github.sha }}"

          done
