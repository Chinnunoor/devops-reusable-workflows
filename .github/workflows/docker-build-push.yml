name: Reusable Maven Build and Docker Push

on:
  workflow_call:
    inputs:
      # services:
      #   description: "JSON list of services"
      #   required: true
      #   type: string

      dockerhub_username:
        description: "Docker Hub username"
        required: true
        type: string

    secrets:
      DOCKERHUB_TOKEN:
        required: true


jobs:
  discover:
    name: Discover Docker Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.discovery.outputs.services }}

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Discover valid Docker services
      # -----------------------------------------------------
      - name: Discover Dockerfiles
        id: discovery
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Docker services..."

          services='[]'

          while IFS= read -r -d '' dockerfile
          do
            # Directory containing Dockerfile
            context="$(dirname "$dockerfile")"

            # Remove leading ./
            context="${context#./}"

            pom="$context/pom.xml"

            echo "------------------------------------------------"
            echo "Checking: $context"

            # ------------------------------------------------
            # Condition 1: pom.xml must exist beside Dockerfile
            # ------------------------------------------------
            if [[ ! -f "$pom" ]]; then
              echo "Skipping: pom.xml not found"
              continue
            fi

            # ------------------------------------------------
            # Condition 2: Dockerfile must not be empty
            # ------------------------------------------------
            if [[ ! -s "$dockerfile" ]]; then
              echo "Skipping: Dockerfile is empty"
              continue
            fi

            # ------------------------------------------------
            # Condition 3: Dockerfile must contain FROM
            # ------------------------------------------------
            if ! grep -Eiq '^[[:space:]]*FROM[[:space:]]+' "$dockerfile"; then
              echo "Skipping: Dockerfile does not contain FROM"
              continue
            fi

            # ------------------------------------------------
            # Condition 4: Dockerfile should contain useful
            # Docker instructions
            # ------------------------------------------------
            if ! grep -Eiq \
              '^[[:space:]]*(RUN|CMD|ENTRYPOINT|COPY|ADD)[[:space:]]+' \
              "$dockerfile"; then

              echo "Skipping: Dockerfile does not contain build/runtime commands"
              continue
            fi


            # ------------------------------------------------
            # Service name = directory name
            # ------------------------------------------------
            name="$(basename "$context")"

            echo "Discovered service:"
            echo "  name    = $name"
            echo "  context = $context"


            # ------------------------------------------------
            # Add service to JSON array
            # ------------------------------------------------
            services="$(
              jq -c \
                --arg name "$name" \
                --arg context "$context" \
                '. + [{
                  name: $name,
                  context: $context
                }]' \
                <<< "$services"
            )"

          done < <(find . -type f -name 'Dockerfile' -print0)


          # --------------------------------------------------
          # Fail if no services were discovered
          # --------------------------------------------------
          if [[ "$(jq 'length' <<< "$services")" -eq 0 ]]; then
            echo "No valid Docker services discovered."
            exit 1
          fi


          # --------------------------------------------------
          # Print pretty JSON for logs
          # --------------------------------------------------
          echo
          echo "Discovered services:"
          jq '.' <<< "$services"


          # --------------------------------------------------
          # GitHub Actions output must be compact JSON
          # --------------------------------------------------
          services="$(jq -c '.' <<< "$services")"

          echo "services=$services" >> "$GITHUB_OUTPUT"

  # =========================================================
  # JOB 1 - MAVEN BUILD
  # =========================================================
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest
    needs: discover
    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Setup Java
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------------------
      # Maven Build
      # -----------------------------------------------------
      - name: Maven Build
        run: mvn -B clean package


      # -----------------------------------------------------
      # Collect all JAR files while preserving directory paths
      # -----------------------------------------------------
      - name: Prepare Maven artifacts
        shell: bash
        run: |
          mkdir -p artifact-bundle

          echo '${{ needs.discover.outputs.services }}' | jq -c '.[]' | while read -r service
          do
            context=$(echo "$service" | jq -r '.context')

            echo "Collecting JAR files from: $context"

            find "$context" \
              -type f \
              -path '*/target/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name 'original-*.jar' \
              -print0 |
            while IFS= read -r -d '' jar
            do
              mkdir -p "artifact-bundle/$(dirname "$jar")"
              cp "$jar" "artifact-bundle/$jar"
            done
          done


      # -----------------------------------------------------
      # Upload Maven build output
      # -----------------------------------------------------
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle/
          retention-days: 7



  # =========================================================
  # JOB 2 - DOCKER BUILD AND PUSH
  # =========================================================
  docker:
    name: Docker - ${{ matrix.service.name }}
  
    needs: 
     - build
     - discover
  
    runs-on: ubuntu-latest
  
    strategy:
      fail-fast: false
  
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
  
    steps:
  
      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
  
  
      # -----------------------------------------------------
      # Download JARs created by Maven job
      # -----------------------------------------------------
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle
  
  
      # -----------------------------------------------------
      # Restore JARs to original target directories
      # -----------------------------------------------------
      - name: Restore Maven artifacts
        shell: bash
        run: |
          cp -R artifact-bundle/. .
  
  
      # -----------------------------------------------------
      # Verify JAR for this service
      # -----------------------------------------------------
      - name: Verify Maven artifact
        shell: bash
        run: |
          echo "Service: ${{ matrix.service.name }}"
          echo "Context: ${{ matrix.service.context }}"
  
          find "${{ matrix.service.context }}" \
            -type f \
            -path '*/target/*.jar' \
            -print
  
  
      # -----------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
  
  
      # -----------------------------------------------------
      # Login to Docker Hub
      # -----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
  
      # -----------------------------------------------------
      # Build and Push Docker Image
      # -----------------------------------------------------
      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
  
          platforms: linux/amd64
  
          push: true
  
          tags: |
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:latest
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:${{ github.sha }}
  
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
