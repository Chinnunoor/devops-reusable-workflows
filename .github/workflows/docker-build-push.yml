name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      services:
        description: "JSON list of services to build"
        required: true
        type: string

      dockerhub_username:
        description: "Docker Hub username"
        required: true
        type: string

    secrets:
      DOCKERHUB_TOKEN:
        required: true


jobs:

  build-and-push:

    name: Build ${{ matrix.service.name }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(inputs.services) }}

    steps:

      # ----------------------------------------
      # 1. Download repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # ----------------------------------------
      # 2. Setup Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ----------------------------------------
      # 3. Login to Docker Hub
      # ----------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4

        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ----------------------------------------
      # 4. Create short Git commit SHA
      # ----------------------------------------
      - name: Generate image version
        id: version
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 5. Build Docker image and push
      # ----------------------------------------
      - name: Build and Push ${{ matrix.service.name }}

        uses: docker/build-push-action@v7

        with:
          context: ${{ matrix.service.context }}

          file: ${{ matrix.service.context }}/Dockerfile

          push: true

          tags: |
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:latest
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:sha-${{ steps.version.outputs.short_sha }}
