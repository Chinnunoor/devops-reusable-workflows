name: Reusable Maven Build and Docker Push

on:
  workflow_call:
    inputs:

      # -----------------------------------------------------
      # Optional Maven goal
      #
      # If empty:
      #   Docker project     -> clean package
      #   Maven-only project -> clean deploy
      #
      # Examples caller can pass:
      #   clean package
      #   clean install
      #   clean deploy
      #   deploy -DskipTests
      # -----------------------------------------------------
      maven_goal:
        description: "Maven goal(s) to run. Leave empty for automatic selection."
        required: false
        type: string
        default: ""

      # -----------------------------------------------------
      # Docker username is optional because Maven-only
      # projects do not need Docker Hub.
      # -----------------------------------------------------
      dockerhub_username:
        description: "Docker Hub username"
        required: false
        type: string
        default: ""

    secrets:

      # -----------------------------------------------------
      # Optional because Maven-only projects do not
      # perform Docker login/push.
      # -----------------------------------------------------
      DOCKERHUB_TOKEN:
        required: false


jobs:

  # =========================================================
  # JOB 1 - DISCOVER DOCKER SERVICES
  # =========================================================

  discover:
    name: Discover Docker Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.discovery.outputs.services }}
      has_docker: ${{ steps.discovery.outputs.has_docker }}

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Discover valid Docker services
      # -----------------------------------------------------
      - name: Discover Dockerfiles
        id: discovery
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Docker services..."

          services='[]'

          while IFS= read -r -d '' dockerfile
          do

            # ------------------------------------------------
            # Directory containing Dockerfile
            # ------------------------------------------------
            context="$(dirname "$dockerfile")"

            # Remove leading ./
            context="${context#./}"

            # Root Dockerfile case
            if [[ "$context" == "." ]]; then
              pom="./pom.xml"
            else
              pom="$context/pom.xml"
            fi


            echo "------------------------------------------------"
            echo "Checking Dockerfile: $dockerfile"
            echo "Context: $context"


            # ------------------------------------------------
            # Condition 1
            # pom.xml must exist beside Dockerfile
            # ------------------------------------------------
            if [[ ! -f "$pom" ]]; then
              echo "Skipping: pom.xml not found beside Dockerfile"
              continue
            fi


            # ------------------------------------------------
            # Condition 2
            # Dockerfile must not be empty
            # ------------------------------------------------
            if [[ ! -s "$dockerfile" ]]; then
              echo "Skipping: Dockerfile is empty"
              continue
            fi


            # ------------------------------------------------
            # Condition 3
            # Dockerfile must contain FROM
            # ------------------------------------------------
            if ! grep -Eiq \
              '^[[:space:]]*FROM[[:space:]]+' \
              "$dockerfile"; then

              echo "Skipping: Dockerfile does not contain FROM"
              continue
            fi


            # ------------------------------------------------
            # Condition 4
            # Dockerfile must contain at least one useful
            # build/runtime instruction
            # ------------------------------------------------
            if ! grep -Eiq \
              '^[[:space:]]*(RUN|CMD|ENTRYPOINT|COPY|ADD)[[:space:]]+' \
              "$dockerfile"; then

              echo "Skipping: Dockerfile has no build/runtime commands"
              continue
            fi


            # ------------------------------------------------
            # Determine service name
            #
            # Nested project:
            # services/customer-service
            # -> customer-service
            #
            # Root project:
            # .
            # -> repository name
            # ------------------------------------------------
            if [[ "$context" == "." ]]; then
              name="${GITHUB_REPOSITORY##*/}"
            else
              name="$(basename "$context")"
            fi


            echo "Valid Docker service discovered:"
            echo "  name    = $name"
            echo "  context = $context"


            # ------------------------------------------------
            # Add service to JSON
            # ------------------------------------------------
            services="$(
              jq -c \
                --arg name "$name" \
                --arg context "$context" \
                '. + [{
                  name: $name,
                  context: $context
                }]' \
                <<< "$services"
            )"

          done < <(
            find . \
              -type f \
              -name 'Dockerfile' \
              -print0
          )


          # --------------------------------------------------
          # Count discovered services
          # --------------------------------------------------
          service_count="$(jq 'length' <<< "$services")"

          echo
          echo "Docker service count: $service_count"


          # --------------------------------------------------
          # IMPORTANT:
          # No Dockerfile is NOT an error anymore.
          #
          # Maven-only projects are allowed.
          # --------------------------------------------------
          if [[ "$service_count" -eq 0 ]]; then

            echo "No valid Docker services discovered."
            echo "This repository will run as a Maven-only project."

            echo 'services=[]' >> "$GITHUB_OUTPUT"
            echo 'has_docker=false' >> "$GITHUB_OUTPUT"

            exit 0
          fi


          # --------------------------------------------------
          # Docker services exist
          # --------------------------------------------------
          echo
          echo "Discovered Docker services:"
          jq '.' <<< "$services"


          # --------------------------------------------------
          # Compact JSON for GitHub Actions matrix
          # --------------------------------------------------
          services="$(jq -c '.' <<< "$services")"

          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "has_docker=true" >> "$GITHUB_OUTPUT"



  # =========================================================
  # JOB 2 - MAVEN BUILD
  # =========================================================

  build:
    name: Build Maven Project

    needs:
      - discover

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Setup Java
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------------------
      # Determine Maven goal
      #
      # Priority:
      #
      # 1. Caller supplied maven_goal
      #
      # 2. Docker project
      #       clean package
      #
      # 3. Maven-only project
      #       clean deploy
      # -----------------------------------------------------
      - name: Determine Maven Goal
        id: maven-goal
        shell: bash
        env:
          REQUESTED_MAVEN_GOAL: ${{ inputs.maven_goal }}
          HAS_DOCKER: ${{ needs.discover.outputs.has_docker }}
        run: |
          set -euo pipefail

          requested_goal="$REQUESTED_MAVEN_GOAL"

          # Remove whitespace to determine whether caller
          # actually supplied something.
          trimmed="${requested_goal//[[:space:]]/}"

          if [[ -n "$trimmed" ]]; then

            maven_goal="$requested_goal"

            echo "Using Maven goal supplied by caller."

          elif [[ "$HAS_DOCKER" == "true" ]]; then

            maven_goal="clean package"

            echo "Docker project detected."
            echo "Using default Maven goal: clean package"

          else

            maven_goal="clean deploy"

            echo "Maven-only project detected."
            echo "Using default Maven goal: clean deploy"

          fi


          echo "Selected Maven goal:"
          echo "mvn -B $maven_goal"

          echo "goal=$maven_goal" >> "$GITHUB_OUTPUT"


      # -----------------------------------------------------
      # Maven Build
      # -----------------------------------------------------
      - name: Maven Build
        shell: bash
        env:
          MAVEN_GOAL: ${{ steps.maven-goal.outputs.goal }}
        run: |
          set -euo pipefail

          echo "Running:"
          echo "mvn -B $MAVEN_GOAL"

          read -r -a MAVEN_ARGS <<< "$MAVEN_GOAL"

          mvn -B "${MAVEN_ARGS[@]}"


      # -----------------------------------------------------
      # Collect JAR files
      #
      # ONLY required when Docker services exist.
      # Maven-only repositories do not need this.
      # -----------------------------------------------------
      - name: Prepare Maven artifacts
        if: needs.discover.outputs.has_docker == 'true'
        shell: bash
        env:
          SERVICES: ${{ needs.discover.outputs.services }}
        run: |
          set -euo pipefail

          mkdir -p artifact-bundle

          echo "$SERVICES" |
          jq -c '.[]' |
          while read -r service
          do

            context="$(echo "$service" | jq -r '.context')"

            echo "------------------------------------------------"
            echo "Collecting JAR files from: $context"


            find "$context" \
              -type f \
              -path '*/target/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name 'original-*.jar' \
              -print0 |
            while IFS= read -r -d '' jar
            do

              mkdir -p \
                "artifact-bundle/$(dirname "$jar")"

              cp \
                "$jar" \
                "artifact-bundle/$jar"

              echo "Collected: $jar"

            done

          done


      # -----------------------------------------------------
      # Verify that Docker projects actually produced JARs
      # -----------------------------------------------------
      - name: Verify Maven artifacts
        if: needs.discover.outputs.has_docker == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Maven artifacts prepared for Docker builds:"

          find artifact-bundle \
            -type f \
            -name '*.jar' \
            -print


          jar_count="$(
            find artifact-bundle \
              -type f \
              -name '*.jar' |
            wc -l |
            tr -d ' '
          )"


          if [[ "$jar_count" -eq 0 ]]; then

            echo "ERROR: Docker services were discovered,"
            echo "but Maven did not produce any JAR artifacts."
            echo
            echo "Make sure the Maven goal includes the package phase."
            echo
            echo "Examples:"
            echo "  clean package"
            echo "  clean install"
            echo "  clean deploy"

            exit 1

          fi


      # -----------------------------------------------------
      # Upload Maven build output
      #
      # ONLY when Docker services exist.
      # -----------------------------------------------------
      - name: Upload Maven artifacts
        if: needs.discover.outputs.has_docker == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle/
          retention-days: 7
          if-no-files-found: error



  # =========================================================
  # JOB 3 - DOCKER BUILD AND PUSH
  # =========================================================

  docker:
    name: Docker - ${{ matrix.service.name }}

    needs:
      - discover
      - build


    # -------------------------------------------------------
    # CRITICAL:
    #
    # Skip the entire Docker matrix when no Docker services
    # were discovered.
    #
    # GitHub evaluates job-level `if` before expanding
    # strategy.matrix.
    # -------------------------------------------------------
    if: needs.discover.outputs.has_docker == 'true'


    runs-on: ubuntu-latest


    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}


    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Validate Docker Hub configuration
      # -----------------------------------------------------
      - name: Validate Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "ERROR: dockerhub_username is required"
            echo "when Docker services are discovered."
            exit 1
          fi

          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "ERROR: DOCKERHUB_TOKEN is required"
            echo "when Docker services are discovered."
            exit 1
          fi


      # -----------------------------------------------------
      # Download JARs created by Maven job
      # -----------------------------------------------------
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle


      # -----------------------------------------------------
      # Restore JARs to their original target directories
      # -----------------------------------------------------
      - name: Restore Maven artifacts
        shell: bash
        run: |
          set -euo pipefail

          cp -R artifact-bundle/. .


      # -----------------------------------------------------
      # Verify JAR for this particular service
      # -----------------------------------------------------
      - name: Verify Maven artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Service:"
          echo "  ${{ matrix.service.name }}"

          echo "Context:"
          echo "  ${{ matrix.service.context }}"

          echo
          echo "JAR files:"

          find "${{ matrix.service.context }}" \
            -type f \
            -path '*/target/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*.jar' \
            -print


      # -----------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # -----------------------------------------------------
      # Login to Docker Hub
      # -----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -----------------------------------------------------
      # Build and Push Docker Image
      # -----------------------------------------------------
      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:

          context: ${{ matrix.service.context }}

          file: ${{ matrix.service.context }}/Dockerfile

          platforms: linux/amd64

          push: true

          tags: |
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:latest
            ${{ inputs.dockerhub_username }}/${{ matrix.service.name }}:${{ github.sha }}

          cache-from: type=gha,scope=${{ matrix.service.name }}

          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
