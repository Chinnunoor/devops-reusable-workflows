name: Reusable Maven Build and Docker Push

on:
  workflow_call:
    inputs:
      services:
        description: "JSON list of services"
        required: true
        type: string

      dockerhub_username:
        description: "Docker Hub username"
        required: true
        type: string

    secrets:
      DOCKERHUB_TOKEN:
        required: true


jobs:

  # =========================================================
  # JOB 1 - MAVEN BUILD
  # =========================================================
  build:
    name: Build Maven Project
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout source code
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Setup Java
      # -----------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # -----------------------------------------------------
      # Maven Build
      # -----------------------------------------------------
      - name: Maven Build
        run: mvn -B clean package


      # -----------------------------------------------------
      # Collect all JAR files while preserving directory paths
      # -----------------------------------------------------
      - name: Prepare Maven artifacts
        shell: bash
        run: |
          mkdir -p artifact-bundle

          echo '${{ inputs.services }}' | jq -c '.[]' | while read -r service
          do
            context=$(echo "$service" | jq -r '.context')

            echo "Collecting JAR files from: $context"

            find "$context" \
              -type f \
              -path '*/target/*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name 'original-*.jar' \
              -print0 |
            while IFS= read -r -d '' jar
            do
              mkdir -p "artifact-bundle/$(dirname "$jar")"
              cp "$jar" "artifact-bundle/$jar"
            done
          done


      # -----------------------------------------------------
      # Upload Maven build output
      # -----------------------------------------------------
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle/
          retention-days: 7



  # =========================================================
  # JOB 2 - DOCKER BUILD AND PUSH
  # =========================================================
  docker:
    name: Docker Build and Push

    # VERY IMPORTANT
    # Job 2 waits for Job 1
    needs: build

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------
      # Checkout repository again
      # -----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7


      # -----------------------------------------------------
      # Download JARs created in Job 1
      # -----------------------------------------------------
      - name: Download Maven artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-build-${{ github.sha }}
          path: artifact-bundle


      # -----------------------------------------------------
      # Put JARs back into original target directories
      # -----------------------------------------------------
      - name: Restore Maven artifacts
        shell: bash
        run: |
          cp -R artifact-bundle/. .


      # -----------------------------------------------------
      # Verify downloaded artifacts
      # -----------------------------------------------------
      - name: Verify Maven artifacts
        shell: bash
        run: |
          echo "Downloaded JAR files:"
          find . -type f -path '*/target/*.jar' -print


      # -----------------------------------------------------
      # Setup Docker Buildx
      # -----------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # -----------------------------------------------------
      # Docker Hub Login
      # -----------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -----------------------------------------------------
      # Build and push all services
      # -----------------------------------------------------
      - name: Build and Push Docker Images
        shell: bash
        run: |
          echo '${{ inputs.services }}' | jq -c '.[]' | while read -r service
          do

            name=$(echo "$service" | jq -r '.name')
            context=$(echo "$service" | jq -r '.context')

            echo "========================================="
            echo "Building service: $name"
            echo "Context: $context"
            echo "========================================="

            docker buildx build \
              --platform linux/amd64 \
              --file "$context/Dockerfile" \
              --tag "${{ inputs.dockerhub_username }}/$name:latest" \
              --tag "${{ inputs.dockerhub_username }}/$name:${{ github.sha }}" \
              --push \
              "$context"

          done
